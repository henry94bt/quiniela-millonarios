name: Actualizar jornada

on:
  schedule:
    # Cada tres horas. El marcador de dataradar solo tiene la jornada que se
    # está jugando: cuando pasa a la siguiente, el resultado de la anterior ya
    # no se puede recoger. Con dos pasadas al día la ventana era demasiado
    # justa, sobre todo con el último partido un lunes por la noche.
    - cron: "0 */3 * * *"
  workflow_dispatch:          # y a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar los partidos de la jornada
        run: node tools/actualizar-jornada.mjs

      - name: Publicar si han cambiado
        run: |
          if git diff --quiet -- jornada.json historico.json resultados.json; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jornada.json historico.json resultados.json
          git commit -m "Datos al día: jornada $(node -p "require('./jornada.json').jornada")"
          git push
