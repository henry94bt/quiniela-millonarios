name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm init -y && npm i playwright@1.49.0 && npx playwright install --with-deps chromium
      - name: ¿Pasa un Chromium real?
        run: |
          cat > p.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const pg = await b.newPage({ locale: 'es-ES' });
          for (const u of [
            'https://www.loteriasyapuestas.es/servicios/proximosv3?game_id=LAQU&num=1',
            'https://www.loteriasyapuestas.es/servicios/fechav3?game_id=LAQU&fecha_sorteo=20260816',
          ]) {
            const r = await pg.goto(u, { waitUntil: 'domcontentloaded', timeout: 45000 });
            const t = await pg.evaluate(() => document.body.innerText);
            console.log('STATUS', r.status(), 'LEN', t.length);
            console.log('HEAD', t.slice(0, 300).replace(/\n/g, ' '));
          }
          await b.close();
          EOF
          node p.mjs
