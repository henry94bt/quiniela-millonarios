<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Las 3 apuestas · La Quiniela</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icono.svg" />
<link rel="apple-touch-icon" href="icono.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0C1512" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0C1512; --panel:#111E1A; --panel-2:#152722; --line:#1F3830;
    --txt:#E8F2EE; --muted:#7E9990;
    --s1:#35C46B; --sx:#E9B949; --s2:#4A9DE0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Archivo',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:20px 14px 150px}

  header{margin-bottom:14px}
  .brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand span{color:var(--s1)}
  .sub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:6px}

  .banner{margin:12px 0;padding:10px 13px;border-radius:10px;font-size:13px;line-height:1.45;
          background:rgba(233,185,73,.10);border:1px solid rgba(233,185,73,.35);color:var(--sx)}

  label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 7px}
  textarea{
    width:100%;min-height:88px;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:15px;font-family:inherit;outline:none;resize:vertical;
  }
  textarea:focus{border-color:var(--s1)}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:7px}
  .hint code{font-family:'JetBrains Mono',monospace;font-size:12px;color:#A9C4BA}

  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{padding:0;border-bottom:1px solid rgba(31,56,48,.55)}
  thead th{padding:0 4px 9px;border-bottom:1px solid var(--line);vertical-align:bottom}
  .thname{font-size:12.5px;font-weight:700;text-align:center;display:block}
  .thcount{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-align:center;display:block;margin-top:2px}
  .thcopy{
    display:block;margin:6px auto 0;padding:4px 7px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    font-family:inherit;font-size:10.5px;font-weight:600;
  }
  .thcopy:active{transform:scale(.95)}
  .cnum{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);width:20px;text-align:right;padding-right:7px}
  .cmatch{font-size:13.5px;line-height:1.25;padding:7px 6px 7px 0;min-width:0}
  .cmatch .vs{color:var(--muted);font-size:11.5px}
  .cell{width:42px;text-align:center;padding:4px 2px}
  .sg{
    width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:transform .08s;
  }
  .sg:active{transform:scale(.9)}
  .sg[data-s="1"]{background:var(--s1);border-color:transparent;color:#0C1512}
  .sg[data-s="X"]{background:var(--sx);border-color:transparent;color:#0C1512}
  .sg[data-s="2"]{background:var(--s2);border-color:transparent;color:#0C1512}
  tr.igual .cmatch{color:var(--txt)}
  tr.igual{background:rgba(53,196,107,.05)}

  .dock{
    position:fixed;left:0;right:0;bottom:0;background:rgba(12,21,18,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .dock .inner{max-width:620px;margin:0 auto}
  .status{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:9px}
  .status b{color:var(--txt)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  button.act{
    padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  button.act:disabled{opacity:.4;cursor:not-allowed}
  button.act.primary:not(:disabled){background:var(--s1);border-color:var(--s1);color:#0C1512}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:20;
    background:var(--s1);color:#0C1512;font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .loading{padding:70px 0;text-align:center;color:var(--muted);font-size:14px}
  footer{margin-top:20px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  footer a{color:var(--s1);text-decoration:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Cargando jornada…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
<script>
/* ============================================================
   Las 3 apuestas de la jornada, juntas.
   Pega los mensajes de WhatsApp de los tres y te deja las tres
   columnas listas para meterlas en TuLotero o pegarlas en la hoja.
   CSV_URL: la misma que en index.html y boleto.html.
   ============================================================ */
var CSV_URL = "PEGA_AQUI_LA_URL_CSV";

/* CSV de la pestaña de respuestas del Google Form. Con esto puesto, las tres
   apuestas aparecen solas y no hace falta pegar nada. README, sección 4. */
var CSV_APUESTAS = "";

/* Los mismos valores que en boleto.html. Con esto, "Guardar las 3" manda a la
   hoja las columnas completas sin pasar por el boleto de cada uno: sirve para
   cuando te llegan por WhatsApp y las juntas tú. */
var FORM_ACTION = "";   // .../formResponse
var FORM_CAMPOS = { jornada: "", nombre: "", signos: "" };

function formListo(){
  return !!FORM_ACTION && !!FORM_CAMPOS.jornada && !!FORM_CAMPOS.nombre && !!FORM_CAMPOS.signos;
}

/* ------------------------------------------------------------ */

var PLAYERS = [
  { key: "henry", name: "Henry" },
  { key: "pedro", name: "Pedro" },
  { key: "adri",  name: "Adri"  },
];
var SIGNS = ["1", "X", "2"];
var CICLO = { "": "1", "1": "X", "X": "2", "2": "" };

var app = document.getElementById("app");
var state = { jornada: null, partidos: [], cols: {}, aviso: "", nota: "" };

function isPlaceholder(u){ return !u || !/^https?:\/\//i.test(u) || u.indexOf("PEGA_AQUI") !== -1; }
function normSign(v){ var s=String(v==null?"":v).trim().toUpperCase(); return (s==="1"||s==="2"||s==="X")?s:""; }
function normKey(k){ return String(k||"").trim().toLowerCase().replace(/[^a-z0-9]/g,""); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- carga de la jornada (igual que boleto.html) ---------- */
/* Abierto con doble clic desde el disco: las rutas relativas no funcionan. */
var SUELTO = location.protocol === "file:" || location.protocol === "data:";
var AVISO_SUELTO = "Has abierto el archivo desde el disco y así no puede cargar los partidos. " +
  "Abre la versión publicada: henry94bt.github.io/quiniela-millonarios/";

function conRespaldo(motivo){
  if(SUELTO){ boot(0, [], {}, AVISO_SUELTO); return; }
  var req = new XMLHttpRequest();
  req.open("GET","jornada.json?v="+Date.now(),true);
  req.onload = function(){
    try{
      var d = JSON.parse(req.responseText);
      boot(d.jornada, d.partidos, {}, motivo+". Partidos de jornada.json.");
    }catch(e){ boot(0,[],{},motivo+", y jornada.json no se pudo leer"); }
  };
  req.onerror = function(){ boot(0,[],{},motivo+", y jornada.json no se pudo descargar"); };
  req.send();
}

function load(){
  if (isPlaceholder(CSV_URL)) { conRespaldo("CSV_URL sin configurar"); return; }
  Papa.parse(CSV_URL,{
    download:true, header:true, skipEmptyLines:true,
    complete:function(res){
      var rows=(res.data||[]).map(function(r){
        var o={}; Object.keys(r).forEach(function(k){ o[normKey(k)]=r[k]; });
        var x={ jornada:parseInt(o.jornada,10), partido:parseInt(o.partido,10)||0,
                local:String(o.local||"").trim(), visitante:String(o.visitante||"").trim(),
                resultado:normSign(o.resultado) };
        PLAYERS.forEach(function(p){ x[p.key]=normSign(o[p.key]); });
        return x;
      }).filter(function(r){ return !isNaN(r.jornada) && (r.local||r.visitante); });

      if(!rows.length){ conRespaldo("El CSV no devolvió filas válidas"); return; }

      var byJ={}; rows.forEach(function(r){ (byJ[r.jornada]=byJ[r.jornada]||[]).push(r); });
      var keys=Object.keys(byJ).map(Number).sort(function(a,b){return a-b;});
      var pend=null;
      for(var i=0;i<keys.length;i++){
        if(byJ[keys[i]].filter(function(r){return r.resultado!=="";}).length===0){ pend=keys[i]; break; }
      }
      if(pend===null){ conRespaldo("La hoja no tiene ninguna jornada pendiente"); return; }

      var partidos=byJ[pend].slice().sort(function(a,b){return a.partido-b.partido;});
      // Si la hoja ya trae apuestas cargadas, las usamos de punto de partida.
      var cols={};
      PLAYERS.forEach(function(p){ cols[p.key]=partidos.map(function(r){ return r[p.key]||""; }); });
      boot(pend, partidos, cols, "");
    },
    error:function(err){ conRespaldo((err&&err.message)||"No se pudo descargar el CSV"); }
  });
}

function storeKey(){ return "quiniela:combinar:J"+state.jornada; }

function boot(jornada, partidos, cols, aviso){
  state.jornada=jornada;
  state.partidos=partidos.slice(0,14);
  state.aviso=aviso||"";
  state.cols={};
  PLAYERS.forEach(function(p){
    var base=(cols&&cols[p.key])||[];
    state.cols[p.key]=state.partidos.map(function(_,i){ return base[i]||""; });
  });
  try{
    var s=JSON.parse(localStorage.getItem(storeKey())||"null");
    if(s&&s.cols) PLAYERS.forEach(function(p){
      if(Array.isArray(s.cols[p.key])&&s.cols[p.key].length===state.partidos.length){
        // lo guardado manda solo donde la hoja no dice nada
        state.cols[p.key]=state.cols[p.key].map(function(v,i){ return v||s.cols[p.key][i]||""; });
      }
    });
  }catch(e){}
  render();
  cargarApuestas();
}

function persist(){
  try{ localStorage.setItem(storeKey(), JSON.stringify({cols:state.cols})); }catch(e){}
}

/* ---------- apuestas guardadas en el formulario ---------- */
function cargarApuestas(){
  if(!CSV_APUESTAS || CSV_APUESTAS.indexOf("PEGA_AQUI")!==-1 || !state.partidos.length) return;
  Papa.parse(CSV_APUESTAS,{
    download:true, header:true, skipEmptyLines:true,
    complete:function(res){
      var n=state.partidos.length, quien={};
      (res.data||[]).forEach(function(r){
        var o={}; Object.keys(r).forEach(function(k){ o[normKey(k)]=r[k]; });
        if(parseInt(o.jornada,10)!==state.jornada) return;
        var nombre=String(o.nombre||"").trim().toLowerCase();
        var pl=PLAYERS.filter(function(p){
          return nombre.indexOf(p.key)!==-1 || p.key.indexOf(nombre)!==-1; })[0];
        if(!pl) return;
        var signos=String(o.signos||"").split(/[,\s]+/).map(normSign).filter(function(s){return s!=="";});
        if(signos.length!==n) return;
        // el formulario va añadiendo filas, así que la última manda: si alguien
        // se corrige y vuelve a enviarla, se queda la buena
        state.cols[pl.key]=signos;
        quien[pl.name]=true;
      });
      var nombres=Object.keys(quien);
      if(nombres.length){
        state.nota="Cargadas del formulario: "+nombres.join(", ")+".";
        persist(); render();
      }
    },
    error:function(){ /* sin conexión: se sigue pudiendo pegar a mano */ }
  });
}

/* ---------- leer los códigos de WhatsApp ---------- */
function importar(texto){
  var re=/\[\s*J(\d+)\s*\|([^|\]]+)\|([^\]]+)\]/gi, m, encontrados=0, otras=[];
  var leidos=[];
  while((m=re.exec(texto))!==null){
    var nombre=m[2].trim().toLowerCase();
    var signos=m[3].split(/[,\s]+/).map(normSign).filter(function(s){return s!=="";});
    var pl=PLAYERS.filter(function(p){ return nombre.indexOf(p.key)!==-1 || p.key.indexOf(nombre)!==-1; })[0];
    if(pl && signos.length) leidos.push({ j:parseInt(m[1],10), pl:pl, signos:signos });
  }

  // Si no se pudieron cargar los partidos (sin conexión, o abierto desde el
  // disco), montamos la rejilla con lo que digan los propios códigos: los
  // signos son lo que importa, los nombres de los equipos son un adorno.
  if(!state.partidos.length && leidos.length){
    var n=leidos[0].signos.length;
    state.jornada=leidos[0].j;
    state.partidos=[];
    for(var k=0;k<n;k++) state.partidos.push({ partido:k+1, local:"Partido "+(k+1), visitante:"" });
    PLAYERS.forEach(function(p){ state.cols[p.key]=new Array(n).fill(""); });
    state.aviso="Sin los nombres de los equipos (no se pudo cargar jornada.json), "+
                "pero los signos van bien. Se ven numerados del 1 al "+n+".";
  }

  for(var q=0;q<leidos.length;q++){
    if(leidos[q].signos.length!==state.partidos.length) continue;
    if(leidos[q].j!==state.jornada) otras.push("J"+leidos[q].j);
    state.cols[leidos[q].pl.key]=leidos[q].signos;
    encontrados++;
  }
  if(encontrados){
    persist();
    state.nota = "Importadas "+encontrados+" apuesta(s)."+
      (otras.length? " Ojo: "+otras.join(", ")+" no coincide con la J"+state.jornada+".":"");
    render();
    toast("Importadas "+encontrados+" apuesta(s)");
  } else if(texto.trim()){
    state.nota="No encontré ningún código válido. Debe ser tal cual lo manda el boleto: [J"+
               state.jornada+"|nombre|1,X,2,…] con "+state.partidos.length+" signos.";
    render();
  }
}

/* ---------- salidas ---------- */
function columnaVertical(key){ return state.cols[key].join("\n"); }
function tsvTresColumnas(){
  return state.partidos.map(function(_,i){
    return PLAYERS.map(function(p){ return state.cols[p.key][i]||""; }).join("\t");
  }).join("\n");
}
function completa(key){
  return state.cols[key].length>0 && state.cols[key].every(function(s){ return s!==""; });
}
function algunaCompleta(){ return PLAYERS.some(function(p){ return completa(p.key); }); }

/* ---------- pintar ---------- */
function render(){
  var n=state.partidos.length;
  var html="";
  html+='<header><div class="brand">LAS <span>3 APUESTAS</span></div>';
  html+='<div class="sub">'+(n?"Jornada "+state.jornada+" · "+n+" partidos":"Sin partidos que mostrar")+'</div></header>';

  if(state.aviso) html+='<div class="banner">'+esc(state.aviso)+'</div>';
  if(state.nota)  html+='<div class="banner">'+esc(state.nota)+'</div>';

  html+='<label for="pegar">Pega aquí los mensajes de WhatsApp</label>';
  html+='<textarea id="pegar" placeholder="Pega la conversación entera si quieres: solo busco los códigos [J'+
        state.jornada+'|nombre|1,X,2,…]"></textarea>';
  html+='<div class="hint">Puedes pegar los tres mensajes de golpe. También puedes tocar cualquier '+
        'casilla para corregirla a mano: va pasando por <code>1 → X → 2 → vacío</code>.</div>';

  html+='<table><thead><tr><th></th><th></th>';
  PLAYERS.forEach(function(p){
    var hechos=state.cols[p.key].filter(Boolean).length;
    html+='<th><span class="thname">'+p.name+'</span>'+
          '<span class="thcount">'+hechos+'/'+n+'</span>'+
          '<button class="thcopy" data-copy="'+p.key+'">copiar</button></th>';
  });
  html+='</tr></thead><tbody>';

  state.partidos.forEach(function(pt,i){
    var vals=PLAYERS.map(function(p){ return state.cols[p.key][i]||""; });
    var todosIguales = vals[0]!=="" && vals.every(function(v){ return v===vals[0]; });
    html+='<tr class="'+(todosIguales?"igual":"")+'">';
    html+='<td class="cnum">'+(pt.partido||i+1)+'</td>';
    html+='<td class="cmatch">'+esc(pt.local)+
          (pt.visitante? ' <span class="vs">–</span> '+esc(pt.visitante) : '')+'</td>';
    PLAYERS.forEach(function(p){
      var v=state.cols[p.key][i]||"";
      html+='<td class="cell"><button class="sg" data-s="'+v+'" data-p="'+p.key+'" data-i="'+i+'">'+
            (v||"·")+'</button></td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';

  html+='<footer><a href="index.html">← Dashboard</a><a href="boleto.html">Rellenar boleto →</a></footer>';

  var totales=PLAYERS.map(function(p){ return p.name+" "+state.cols[p.key].filter(Boolean).length; }).join(" · ");
  var completas=PLAYERS.filter(function(p){ return completa(p.key); }).length;
  html+='<div class="dock"><div class="inner">'+
        '<div class="status"><span>'+totales+'</span><span><b>'+n+'</b> partidos</span></div>'+
        '<div class="actions">'+
        '<button class="act" id="tsv" '+(algunaCompleta()?"":"disabled")+'>Copiar para la hoja</button>'+
        (formListo()
          ? '<button class="act primary" id="guardar" '+(completas?"":"disabled")+'>'+
            'Guardar '+(completas===1?"1 apuesta":"las "+completas)+'</button>'
          : '<button class="act primary" id="wa" '+(algunaCompleta()?"":"disabled")+'>Enviar las 3 por WhatsApp</button>')+
        '</div>'+
        (formListo()
          ? '<div class="hint" style="margin-top:8px">También puedes mandarlas por '+
            '<a href="#" id="walink" style="color:var(--s1)">WhatsApp</a>.</div>'
          : '<div class="hint" style="margin-top:8px">Para guardarlas directamente en la hoja hay que '+
            'configurar el formulario (README, sección 4).</div>')+
        '</div></div>';

  app.innerHTML=html;

  var ta=document.getElementById("pegar");
  ta.addEventListener("paste", function(){ setTimeout(function(){ importar(ta.value); },0); });
  ta.addEventListener("input", function(){ if(ta.value.indexOf("]")!==-1) importar(ta.value); });

  Array.prototype.forEach.call(app.querySelectorAll(".sg"), function(b){
    b.addEventListener("click", function(){
      var i=+b.dataset.i, k=b.dataset.p;
      state.cols[k][i]=CICLO[state.cols[k][i]||""];
      persist(); render();
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll(".thcopy"), function(b){
    b.addEventListener("click", function(){
      var k=b.dataset.copy;
      copiar(columnaVertical(k), "Columna de "+PLAYERS.filter(function(p){return p.key===k;})[0].name+" copiada");
    });
  });
  var tsv=document.getElementById("tsv");
  if(tsv) tsv.addEventListener("click", function(){
    copiar(tsvTresColumnas(), "3 columnas copiadas: pega en la casilla de Henry");
  });
  var wa=document.getElementById("wa");
  if(wa) wa.addEventListener("click", enviarWhatsApp);
  var walink=document.getElementById("walink");
  if(walink) walink.addEventListener("click", function(e){ e.preventDefault(); enviarWhatsApp(); });
  var guardar=document.getElementById("guardar");
  if(guardar) guardar.addEventListener("click", onGuardar);
}

/* ---------- guardar las columnas completas en el formulario ---------- */
function onGuardar(){
  var pendientes=PLAYERS.filter(function(p){ return completa(p.key); });
  if(!pendientes.length){ toast("Ninguna apuesta está completa"); return; }

  var btn=document.getElementById("guardar");
  btn.disabled=true; btn.textContent="Guardando…";

  // De una en una y en orden, para que en la hoja queden en el mismo orden en
  // que se ven aquí y no dependa de cuál conteste antes.
  var hechas=0;
  function siguiente(){
    if(hechas>=pendientes.length){
      toast("Guardadas "+hechas+" apuesta(s) de la J"+state.jornada);
      btn.textContent="Guardar otra vez"; btn.disabled=false;
      return;
    }
    var p=pendientes[hechas];
    var fd=new FormData();
    fd.append(FORM_CAMPOS.jornada, String(state.jornada));
    fd.append(FORM_CAMPOS.nombre, p.name);
    fd.append(FORM_CAMPOS.signos, state.cols[p.key].join(","));
    fetch(FORM_ACTION,{ method:"POST", mode:"no-cors", body:fd })
      .then(function(){ hechas++; siguiente(); })
      .catch(function(){
        toast("Falló al guardar la de "+p.name+". ¿Tienes conexión?");
        btn.textContent="Reintentar"; btn.disabled=false;
      });
  }
  siguiente();
}

/* ---------- portapapeles ---------- */
function copiar(texto, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){ toast(ok); }, function(){ fallback(texto, ok); });
  } else fallback(texto, ok);
}
function fallback(texto, ok){
  var ta=document.createElement("textarea");
  ta.value=texto; ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,texto.length);
  var hecho=false; try{ hecho=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  toast(hecho?ok:"No pude copiar; hazlo a mano");
}

function enviarWhatsApp(){
  var lineas=state.partidos.map(function(pt,i){
    var vals=PLAYERS.map(function(p){ return (state.cols[p.key][i]||"·"); });
    return String(pt.partido||i+1).padStart(2," ")+". "+vals.join("  ")+"   "+pt.local+" - "+pt.visitante;
  });
  var texto="Quiniela J"+state.jornada+" · "+PLAYERS.map(function(p){return p.name;}).join(" / ")+"\n\n"+
            lineas.join("\n");
  window.open("https://wa.me/?text="+encodeURIComponent(texto), "_blank");
}

var toastEl=document.getElementById("toast"), toastT=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove("show"); },2400);
}

load();
</script>
