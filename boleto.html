<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Boleto · La Quiniela</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icono.svg" />
<link rel="apple-touch-icon" href="icono.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0C1512" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0C1512; --panel:#111E1A; --panel-2:#152722; --line:#1F3830;
    --txt:#E8F2EE; --muted:#7E9990;
    --s1:#35C46B; --sx:#E9B949; --s2:#4A9DE0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Archivo',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .wrap{max-width:560px;margin:0 auto;padding:20px 14px 150px}

  /* En pantalla ancha, las tres apuestas se ven al lado del boleto. */
  @media (min-width:940px){
    .wrap{max-width:1040px}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
  }

  header{margin-bottom:16px}
  .brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand span{color:var(--s1)}
  .sub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:6px}

  .banner{margin:14px 0;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.45;
          background:rgba(233,185,73,.10);border:1px solid rgba(233,185,73,.35);color:var(--sx)}
  .banner code{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#F6D98A}

  h3{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
     margin:26px 0 10px;font-weight:700}

  .field{margin:14px 0 18px}
  label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
  input[type=text],textarea{
    width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px;font-family:inherit;outline:none;
  }
  textarea{min-height:76px;font-size:15px;resize:vertical}
  input[type=text]:focus,textarea:focus{border-color:var(--s1)}

  .row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;
       background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}
  .row.done{border-color:rgba(53,196,107,.32)}
  .idx{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-align:right}
  .teams{min-width:0;font-size:14.5px;line-height:1.3}
  .teams .vs{color:var(--muted);font-size:12px}
  .btns{display:flex;gap:6px}
  .sb{
    width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .15s;
  }
  .sb:active{transform:scale(.93)}
  .sb.on{color:#0C1512;border-color:transparent}
  .sb.on[data-s="1"]{background:var(--s1)}
  .sb.on[data-s="X"]{background:var(--sx)}
  .sb.on[data-s="2"]{background:var(--s2)}

  /* ---- las tres apuestas juntas ---- */
  .tres{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:0;border-bottom:1px solid rgba(31,56,48,.5)}
  thead th{padding:0 3px 8px;border-bottom:1px solid var(--line);vertical-align:bottom}
  .thname{font-size:12px;font-weight:700;text-align:center;display:block}
  .thcount{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-align:center;display:block}
  .cnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:18px;text-align:right;padding-right:6px}
  .cmatch{font-size:13px;line-height:1.25;padding:6px 5px 6px 0;min-width:0}
  .cmatch .vs{color:var(--muted);font-size:11px}
  .cell{width:38px;text-align:center;padding:3px 1px}
  .sg{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .sg:active{transform:scale(.9)}
  .sg[data-s="1"]{background:var(--s1);border-color:transparent;color:#0C1512}
  .sg[data-s="X"]{background:var(--sx);border-color:transparent;color:#0C1512}
  .sg[data-s="2"]{background:var(--s2);border-color:transparent;color:#0C1512}
  tr.igual{background:rgba(53,196,107,.06)}
  .vacio{color:var(--muted);font-size:13px;line-height:1.5;padding:6px 0}

  .mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .mini button,.mini a{
    padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--txt);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;
  }
  .mini button:disabled{opacity:.4;cursor:not-allowed}
  .mini a{color:var(--s1)}

  .barwrap{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:10px}
  .barfill{height:100%;background:var(--s1);width:0;transition:width .25s}

  .dock{
    position:fixed;left:0;right:0;bottom:0;background:rgba(12,21,18,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .dock .inner{max-width:560px;margin:0 auto}
  .status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:9px}
  .status b{color:var(--txt)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  button.act{
    padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  }
  button.act:disabled{opacity:.4;cursor:not-allowed}
  button.act.primary:not(:disabled){background:var(--s1);border-color:var(--s1);color:#0C1512}
  button.act:active:not(:disabled){transform:scale(.98)}

  .loading{padding:70px 0;text-align:center;color:var(--muted);font-size:14px}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:20;
    background:var(--s1);color:#0C1512;font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center
  }
  .toast.show{opacity:1}
  footer{margin-top:24px;font-size:12px;color:var(--muted)}
  footer a{color:var(--s1);text-decoration:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Cargando jornada…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
<script>
/* ============================================================
   El boleto. Hace dos cosas en la misma página:
     1) cada uno marca sus 14 signos y los guarda
     2) debajo (o al lado, en pantalla ancha) se ven las tres
        apuestas de la jornada, para poder echarla en TuLotero

   CSV_URL      opcional, hoja con los partidos (si no, jornada.json)
   WHATSAPP_TO  opcional, número con prefijo y sin +, p.ej. "34600111222"
   ============================================================ */
var CSV_URL = "PEGA_AQUI_LA_URL_CSV";
var WHATSAPP_TO = "";

/* CSV de la pestaña de respuestas del Google Form, si se llega a montar. */
var CSV_APUESTAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkLp7AXEddv38iExHBbkEWbKnMj5cXV6OFISGILBMVB61x04NkCRYlXAdR9tOdvQ1H1Pfmn0Di5VbK/pub?output=csv";

/* Google Form. Con esto puesto, "Guardar" escribe la apuesta directamente y
   ya no hace falta ni WhatsApp ni pegar nada. Ver README, sección 4. */
var FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSeI2hNbrTgkF8m7M4pCJP-a2bkFBGq1iycy6hoAMNUlk_xXHg/formResponse";
var FORM_CAMPOS = { jornada: "entry.1366000101", nombre: "entry.190246688", signos: "entry.408769673" };

/* Donde se guardan las apuestas sin depender de nada de fuera. */
var URL_EDITAR_APUESTAS =
  "https://github.com/henry94bt/quiniela-millonarios/edit/main/apuestas.json";

/* ------------------------------------------------------------ */

var PLAYERS = [
  { key: "henry", name: "Henry" },
  { key: "pedro", name: "Pedro" },
  { key: "adri",  name: "Adri"  },
];
var SIGNS = ["1", "X", "2"];
var CICLO = { "": "1", "1": "X", "X": "2", "2": "" };

var app = document.getElementById("app");
var state = {
  jornada: null, temporada: "", partidos: [],
  picks: [], nombre: "", enviado: false,
  cols: {},            // las tres apuestas de la jornada
  aviso: "", nota: "", pegar: false,
};

function formListo() {
  return !!FORM_ACTION && !!FORM_CAMPOS.jornada && !!FORM_CAMPOS.nombre && !!FORM_CAMPOS.signos;
}
function isPlaceholder(u) { return !u || !/^https?:\/\//i.test(u) || u.indexOf("PEGA_AQUI") !== -1; }
function normSign(v) {
  var s = String(v == null ? "" : v).trim().toUpperCase();
  return (s === "1" || s === "2" || s === "X") ? s : "";
}
function normKey(k) { return String(k || "").trim().toLowerCase().replace(/[^a-z0-9]/g, ""); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function jugadorPorNombre(n) {
  var b = String(n || "").trim().toLowerCase();
  return PLAYERS.filter(function (p) {
    return b.indexOf(p.key) !== -1 || p.key.indexOf(b) !== -1;
  })[0];
}

/* Abierto con doble clic desde el disco: las rutas relativas no funcionan. */
var SUELTO = location.protocol === "file:" || location.protocol === "data:";
var AVISO_SUELTO = "Has abierto el archivo desde el disco y así no puede cargar los partidos. " +
  "Abre la versión publicada: henry94bt.github.io/quiniela-millonarios/";

/* ---------- los partidos de la jornada ---------- */
function conRespaldo(motivo) {
  if (SUELTO) { boot(0, [], AVISO_SUELTO); return; }
  var req = new XMLHttpRequest();
  req.open("GET", "jornada.json?v=" + Date.now(), true);
  req.onload = function () {
    try {
      var d = JSON.parse(req.responseText);
      state.temporada = d.temporada || "";
      boot(d.jornada, d.partidos, motivo ? motivo + ". Partidos de jornada.json." : "");
    } catch (e) { boot(0, [], (motivo || "Error") + ", y jornada.json no se pudo leer"); }
  };
  req.onerror = function () { boot(0, [], (motivo || "Error") + ", y jornada.json no se pudo descargar"); };
  req.send();
}

function load() {
  if (isPlaceholder(CSV_URL)) { conRespaldo(""); return; }
  Papa.parse(CSV_URL, {
    download: true, header: true, skipEmptyLines: true,
    complete: function (res) {
      var rows = (res.data || []).map(function (r) {
        var o = {};
        Object.keys(r).forEach(function (k) { o[normKey(k)] = r[k]; });
        return {
          jornada: parseInt(o.jornada, 10), partido: parseInt(o.partido, 10) || 0,
          local: String(o.local || "").trim(), visitante: String(o.visitante || "").trim(),
          resultado: normSign(o.resultado),
        };
      }).filter(function (r) { return !isNaN(r.jornada) && (r.local || r.visitante); });

      if (!rows.length) { conRespaldo("El CSV no devolvió filas válidas"); return; }

      var byJ = {};
      rows.forEach(function (r) { (byJ[r.jornada] = byJ[r.jornada] || []).push(r); });
      var keys = Object.keys(byJ).map(Number).sort(function (a, b) { return a - b; });
      var pend = null;
      for (var i = 0; i < keys.length; i++) {
        if (byJ[keys[i]].filter(function (r) { return r.resultado !== ""; }).length === 0) { pend = keys[i]; break; }
      }
      if (pend === null) { conRespaldo("La hoja no tiene ninguna jornada pendiente"); return; }
      boot(pend, byJ[pend].slice().sort(function (a, b) { return a.partido - b.partido; }), "");
    },
    error: function (err) { conRespaldo((err && err.message) || "No se pudo descargar el CSV"); }
  });
}

function storeKey() { return "quiniela:boleto:J" + state.jornada; }

function boot(jornada, partidos, aviso) {
  state.jornada = jornada;
  state.partidos = (partidos || []).slice(0, 14);
  state.picks = state.partidos.map(function () { return ""; });
  state.aviso = aviso || "";
  PLAYERS.forEach(function (p) {
    state.cols[p.key] = state.partidos.map(function () { return ""; });
  });
  try {
    var s = JSON.parse(localStorage.getItem(storeKey()) || "null");
    if (s && Array.isArray(s.picks) && s.picks.length === state.picks.length) {
      state.picks = s.picks;
      state.nombre = s.nombre || "";
      state.enviado = !!s.enviado;
    }
  } catch (e) {}
  render();
  cargarGuardadas();
}

function persist() {
  try {
    localStorage.setItem(storeKey(),
      JSON.stringify({ picks: state.picks, nombre: state.nombre, enviado: state.enviado }));
  } catch (e) {}
}

/* ---------- las apuestas ya guardadas ---------- */
function meter(nombre, signos) {
  var pl = jugadorPorNombre(nombre);
  if (!pl || signos.length !== state.partidos.length) return null;
  state.cols[pl.key] = signos;
  return pl.name;
}

function cargarGuardadas() {
  if (SUELTO || !state.partidos.length) return;
  var visto = {};
  var pinta = function () {
    var nombres = Object.keys(visto);
    if (nombres.length) { state.nota = "Ya guardadas: " + nombres.join(", ") + "."; render(); }
  };

  var req = new XMLHttpRequest();
  req.open("GET", "apuestas.json?v=" + Date.now(), true);
  req.onload = function () {
    try {
      (JSON.parse(req.responseText) || []).forEach(function (a) {
        if (parseInt(a.jornada, 10) !== state.jornada) return;
        var signos = String(a.signos || "").split(/[,\s]+/).map(normSign)
                       .filter(function (s) { return s !== ""; });
        var quien = meter(a.nombre, signos);
        if (quien) { visto[quien] = true; if (a.temporada) state.temporada = a.temporada; }
      });
      pinta();
    } catch (e) {}
  };
  req.send();

  // Si además hay hoja del formulario, lo de ahí es más reciente y manda.
  if (!isPlaceholder(CSV_APUESTAS)) {
    Papa.parse(CSV_APUESTAS, {
      download: true, header: true, skipEmptyLines: true,
      complete: function (res) {
        (res.data || []).forEach(function (r) {
          var o = {};
          Object.keys(r).forEach(function (k) { o[normKey(k)] = r[k]; });
          if (parseInt(o.jornada, 10) !== state.jornada) return;
          var signos = String(o.signos || o.signo || "").split(/[,\s]+/).map(normSign)
                         .filter(function (s) { return s !== ""; });
          var quien = meter(o.nombre, signos);
          if (quien) visto[quien] = true;
        });
        pinta();
      },
      error: function () {}
    });
  }
}

/* Códigos de WhatsApp, por si alguien la manda por ahí en vez de guardarla. */
function importar(texto) {
  var re = /\[\s*J(\d+)\s*\|([^|\]]+)\|([^\]]+)\]/gi, m, n = 0;
  while ((m = re.exec(texto)) !== null) {
    var signos = m[3].split(/[,\s]+/).map(normSign).filter(function (s) { return s !== ""; });
    if (meter(m[2], signos)) n++;
  }
  if (n) { state.nota = "Importadas " + n + " del mensaje."; render(); toast("Importadas " + n); }
  else if (texto.trim()) { toast("No encontré ningún código válido"); }
}

/* ---------- salidas ---------- */
var completaLa = function (key) {
  return state.cols[key].length > 0 && state.cols[key].every(function (s) { return s !== ""; });
};
var cuantasCompletas = function () {
  return PLAYERS.filter(function (p) { return completaLa(p.key); }).length;
};
function bloqueParaRepo() {
  return PLAYERS.filter(function (p) { return completaLa(p.key); }).map(function (p) {
    return '  { "temporada": "' + (state.temporada || "") + '", "jornada": ' + state.jornada +
           ', "nombre": "' + p.name + '", "signos": "' + state.cols[p.key].join(",") + '" },';
  }).join("\n");
}
function tsvTres() {
  return state.partidos.map(function (_, i) {
    return PLAYERS.map(function (p) { return state.cols[p.key][i] || ""; }).join("\t");
  }).join("\n");
}

/* ---------- pintar ---------- */
function render() {
  var n = state.partidos.length;
  var done = state.picks.filter(Boolean).length;
  var completo = n > 0 && done === n;
  var h = "";

  h += '<header><div class="brand">LA <span>QUINIELA</span></div>';
  h += '<div class="sub">' + (n ? "Jornada " + state.jornada + " · " + n + " partidos"
                                : "Sin partidos que mostrar") + '</div></header>';
  if (state.aviso) h += '<div class="banner">' + esc(state.aviso) + '</div>';

  h += '<div class="cols">';

  /* ---- columna 1: tu boleto ---- */
  h += '<div>';
  h += '<div class="field"><label for="nombre">Tu nombre</label>' +
       '<input type="text" id="nombre" placeholder="Henry, Pedro, Adri…" autocomplete="name" value="' +
       esc(state.nombre) + '" /></div>';
  state.partidos.forEach(function (p, i) {
    var sel = state.picks[i];
    h += '<div class="row' + (sel ? " done" : "") + '">' +
         '<div class="idx">' + (p.partido || i + 1) + '</div>' +
         '<div class="teams">' + esc(p.local) +
         (p.visitante ? ' <span class="vs">–</span> ' + esc(p.visitante) : '') + '</div>' +
         '<div class="btns">' +
         SIGNS.map(function (s) {
           return '<button class="sb' + (sel === s ? " on" : "") + '" data-s="' + s +
                  '" data-i="' + i + '" type="button" aria-pressed="' + (sel === s) + '">' + s + '</button>';
         }).join("") + '</div></div>';
  });
  h += '</div>';

  /* ---- columna 2: las tres de la jornada ---- */
  h += '<div><h3>Las tres de esta jornada</h3><div class="tres">';
  if (!n) {
    h += '<div class="vacio">Sin partidos.</div>';
  } else if (cuantasCompletas() === 0) {
    h += '<div class="vacio">Todavía no hay ninguna guardada. Según las vayáis ' +
         'guardando aparecerán aquí, listas para echar la quiniela.</div>';
  } else {
    h += '<table><thead><tr><th></th><th></th>';
    PLAYERS.forEach(function (p) {
      h += '<th><span class="thname">' + p.name + '</span><span class="thcount">' +
           state.cols[p.key].filter(Boolean).length + '/' + n + '</span></th>';
    });
    h += '</tr></thead><tbody>';
    state.partidos.forEach(function (pt, i) {
      var vs = PLAYERS.map(function (p) { return state.cols[p.key][i] || ""; });
      var igual = vs[0] !== "" && vs.every(function (v) { return v === vs[0]; });
      h += '<tr class="' + (igual ? "igual" : "") + '">';
      h += '<td class="cnum">' + (pt.partido || i + 1) + '</td>';
      h += '<td class="cmatch">' + esc(pt.local) +
           (pt.visitante ? ' <span class="vs">–</span> ' + esc(pt.visitante) : '') + '</td>';
      PLAYERS.forEach(function (p) {
        var v = state.cols[p.key][i] || "";
        h += '<td class="cell"><button class="sg" data-s="' + v + '" data-p="' + p.key +
             '" data-i="' + i + '">' + (v || "·") + '</button></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
  }

  h += '<div class="mini">' +
       '<button id="repo"' + (cuantasCompletas() ? "" : " disabled") + '>Copiar para guardar</button>' +
       '<a href="' + URL_EDITAR_APUESTAS + '" target="_blank" rel="noopener">Abrir apuestas.json</a>' +
       '<button id="tsv"' + (cuantasCompletas() ? "" : " disabled") + '>Copiar 3 columnas</button>' +
       '<button id="verpegar">Pegar de WhatsApp</button>' +
       '</div>';
  if (state.pegar) {
    h += '<div style="margin-top:10px"><textarea id="pegar" placeholder="Pega aquí los mensajes; ' +
         'solo busco los códigos [J' + state.jornada + '|nombre|1,X,2,…]"></textarea></div>';
  }
  if (state.nota) h += '<div class="banner" style="margin-bottom:0">' + esc(state.nota) + '</div>';
  h += '</div></div>';

  h += '</div>';  /* /cols */

  h += '<footer><a href="index.html">← Ver el dashboard</a></footer>';

  h += '<div class="dock"><div class="inner">' +
       '<div class="status"><span><b>' + done + '</b> / ' + n + ' signos</span>' +
       '<span>' + (state.enviado ? "Guardada ✓" : completo ? "¡Boleto completo!" : "Faltan " + (n - done)) +
       '</span></div>' +
       '<div class="barwrap"><div class="barfill" style="width:' + (n ? (done / n) * 100 : 0) + '%"></div></div>' +
       '<div class="actions" style="margin-top:11px">' +
       '<button class="act" id="copy"' + (completo ? "" : " disabled") + '>Copiar signos</button>' +
       (formListo()
         ? '<button class="act primary" id="guardar"' + (completo ? "" : " disabled") + '>' +
           (state.enviado ? "Guardar otra vez" : "Guardar apuesta") + '</button>'
         : '<button class="act primary" id="wa"' + (completo ? "" : " disabled") + '>Enviar por WhatsApp</button>') +
       '</div></div></div>';

  app.innerHTML = h;
  conectar();
}

function conectar() {
  var nombre = document.getElementById("nombre");
  if (nombre) nombre.addEventListener("input", function () { state.nombre = nombre.value; persist(); });

  Array.prototype.forEach.call(app.querySelectorAll(".sb"), function (b) {
    b.addEventListener("click", function () {
      var i = +b.dataset.i, s = b.dataset.s;
      state.picks[i] = state.picks[i] === s ? "" : s;
      state.enviado = false;
      persist(); render();
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll(".sg"), function (b) {
    b.addEventListener("click", function () {
      var i = +b.dataset.i, k = b.dataset.p;
      state.cols[k][i] = CICLO[state.cols[k][i] || ""];
      render();
    });
  });

  var el;
  if ((el = document.getElementById("copy"))) el.addEventListener("click", function () {
    copiar(state.picks.join("\n"), "14 signos copiados");
  });
  if ((el = document.getElementById("wa"))) el.addEventListener("click", enviarWhatsApp);
  if ((el = document.getElementById("guardar"))) el.addEventListener("click", onGuardar);
  if ((el = document.getElementById("repo"))) el.addEventListener("click", function () {
    copiar(bloqueParaRepo(), "Copiado. Pégalo en apuestas.json, debajo del [");
  });
  if ((el = document.getElementById("tsv"))) el.addEventListener("click", function () {
    copiar(tsvTres(), "3 columnas copiadas");
  });
  if ((el = document.getElementById("verpegar"))) el.addEventListener("click", function () {
    state.pegar = !state.pegar; render();
    var t = document.getElementById("pegar"); if (t) t.focus();
  });
  if ((el = document.getElementById("pegar"))) {
    el.addEventListener("input", function () { if (el.value.indexOf("]") !== -1) importar(el.value); });
  }
}

/* ---------- acciones ---------- */
function codigo() {
  return "[J" + state.jornada + "|" + (state.nombre.trim() || "sin nombre") + "|" + state.picks.join(",") + "]";
}
function enviarWhatsApp() {
  var lineas = state.partidos.map(function (p, i) {
    return (p.partido || i + 1) + ". " + p.local + (p.visitante ? " - " + p.visitante : "") + ": " + state.picks[i];
  });
  var texto = "Quiniela J" + state.jornada + " · " + (state.nombre.trim() || "sin nombre") + "\n\n" +
              lineas.join("\n") + "\n\n" + codigo();
  var base = WHATSAPP_TO ? "https://wa.me/" + WHATSAPP_TO.replace(/[^0-9]/g, "") : "https://wa.me/";
  window.open(base + "?text=" + encodeURIComponent(texto), "_blank");
}

function onGuardar() {
  var nombre = state.nombre.trim();
  if (!nombre) { toast("Escribe tu nombre antes de guardar"); return; }
  var btn = document.getElementById("guardar");
  btn.disabled = true; btn.textContent = "Guardando…";

  var fd = new FormData();
  fd.append(FORM_CAMPOS.jornada, String(state.jornada));
  fd.append(FORM_CAMPOS.nombre, nombre);
  fd.append(FORM_CAMPOS.signos, state.picks.join(","));

  // Google no deja leer su respuesta desde otro dominio (no-cors): sabemos si
  // salió, no lo que contestó. Si falla la red, sí lo vemos.
  fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body: fd })
    .then(function () {
      state.enviado = true;
      meter(nombre, state.picks.slice());
      persist(); toast("Guardada, " + nombre); render();
    })
    .catch(function () {
      btn.disabled = false; btn.textContent = "Reintentar";
      toast("No se pudo guardar. ¿Tienes conexión?");
    });
}

/* ---------- portapapeles ---------- */
function copiar(texto, ok) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(function () { toast(ok); }, function () { respaldo(texto, ok); });
  } else respaldo(texto, ok);
}
function respaldo(texto, ok) {
  var ta = document.createElement("textarea");
  ta.value = texto; ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
  var hecho = false;
  try { hecho = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  toast(hecho ? ok : "No pude copiar; hazlo a mano");
}

var toastEl = document.getElementById("toast"), toastT = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
}

load();
</script>
